[package]
name = "shaft-inspector"
description = "Capturing HTTP reverse proxy, request store and replay for Shaft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
bytes.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
parking_lot.workspace = true
futures.workspace = true
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "native-tokio", "aws-lc-rs", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
flate2 = "1"
brotli = "8"
base64 = "0.22"
httpdate = "1"
rustls-native-certs = "0.8"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
