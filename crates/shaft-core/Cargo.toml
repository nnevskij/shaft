[package]
name = "shaft-core"
description = "Shaft tunnel manager: ngrok sessions, endpoints, inspection and diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
shaft-config.workspace = true
shaft-inspector.workspace = true
shaft-api.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
parking_lot.workspace = true
futures.workspace = true
bytes.workspace = true
ngrok = { version = "0.19", features = ["hyper"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
rustls-native-certs = "0.8"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
parking_lot.workspace = true
