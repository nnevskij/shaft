[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nnevskij/shaft"

[workspace.dependencies]
shaft-config = { path = "crates/shaft-config" }
shaft-inspector = { path = "crates/shaft-inspector" }
shaft-api = { path = "crates/shaft-api" }
shaft-core = { path = "crates/shaft-core" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tracing = "0.1"
url = "2"
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "server-auto", "tokio", "http1", "http2"] }
dirs = "6"
parking_lot = "0.12"
futures = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
