name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: macos-14
    env:
      SHAFT_E2E_AUTHTOKEN: ${{ secrets.SHAFT_E2E_AUTHTOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Online tunnel test
        if: env.SHAFT_E2E_AUTHTOKEN != ''
        run: cargo test -p shaft-core --test manager -- --ignored
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: macos-14
    permissions:
      contents: write
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build number = commit count
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Check tag matches Cargo version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version} (run scripts/release.sh)"
            exit 1
          fi
      - name: Require signing secrets
        run: |
          if [[ -z "$MACOS_CERT_P12" || -z "$NOTARY_KEY_P8" ]]; then
            echo "::error::MACOS_CERT_P12 and NOTARY_KEY_P8 secrets are required to publish a release (see docs/RELEASING.md)"
            exit 1
          fi
      - name: Import signing certificate
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Bundle, sign and notarize
        env:
          UNIVERSAL: "1"
          DMG: "1"
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: NOTARY_KEY="$RUNNER_TEMP/AuthKey.p8" scripts/bundle.sh
      - name: Clean up credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
      # The app's update check reads /releases/latest, which only lists
      # published, non-prerelease releases: publishing is what ships the update.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Shaft-*.dmg
            dist/Shaft-*.dmg.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
